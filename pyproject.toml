[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseraloom"
version = "1.0.0"
description = "Map mosaic tile codes to a numbered layout, count tiles per color, and export a cut list."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "TesseraLoom" }]
keywords = ["mosaic", "tiles", "cli", "layout", "cut-list"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
tesseraloom = "tesseraloom:main"

[tool.setuptools]
py-modules = ["tesseraloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ISC", "C4", "SIM"]
